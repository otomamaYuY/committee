# source of truth for `type`/`branch` values: .claude/git-conventions.yaml
# (commit-check can't import YAML, so this file is kept in manual sync —
# low churn in practice since most projects use the default commit types)
checks:
  - check: message
    regex: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
  - check: branch
    regex: '^(main|master|develop|(feature|feat|bugfix|fix|hotfix|release|chore|claude)\/[a-z0-9]+(-[a-z0-9]+)*)$'
