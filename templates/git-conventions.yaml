# Single source of truth for this repo's git conventions.
# Consumed by: .claude/skills/git-conventions/SKILL.md (knowledge),
# commitlint.config.js (commit messages) and .githooks/pre-push (branch
# names). All three read this file; none of them restate its contents.

commit_types:
  - feat
  - fix
  - docs
  - style
  - refactor
  - perf
  - test
  - build
  - ci
  - chore
  - revert

branch_types:
  - feature
  - feat
  - bugfix
  - fix
  - hotfix
  - release
  - chore
  # Conventional Branch's AI-agent prefixes. Keep the branches an agent
  # opens distinguishable from the ones a person opens — it is the cheapest
  # signal a reviewer gets about where a change came from.
  - claude
  - codex

comment_labels:
  - praise
  - nitpick
  - suggestion
  - issue
  - question
  - todo
  - thought
  - chore
  - note

# Optional, and deliberately empty here: a scope names the part of *your*
# repo a change touches, so this kit cannot guess the list. Uncomment the
# block and fill it in, and commitlint will reject any scope not on it.
# Leave it as it is and any scope is accepted, which is the right default
# until you know what your seams are.
#
# A scope is what turns `type` alone into a coordinate: `feat` says what
# happened, `feat(billing)` says where — which is what makes the history
# answerable by tooling, and by anyone asking what has been changing lately.
#
# Only add a name once it is a real seam someone would want to read the
# history of. A list that does not cover a change you legitimately need to
# make is a list that sends you looking for --no-verify — add the scope
# here instead.
#
# scopes:
#   - api
#   - web
#   - infra
