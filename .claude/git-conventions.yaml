# Single source of truth for this repo's git conventions.
# Consumed by: .claude/skills/git-conventions/SKILL.md (knowledge),
# commitlint.config.js (commit messages) and .githooks/pre-push (branch
# names). All three read this file; none of them restate its contents.

commit_types:
  - feat
  - fix
  - docs
  - style
  - refactor
  - perf
  - test
  - build
  - ci
  - chore
  - revert

branch_types:
  - feature
  - feat
  - bugfix
  - fix
  - hotfix
  - release
  - chore
  # Conventional Branch's AI-agent prefixes. Keep the branches an agent
  # opens distinguishable from the ones a person opens — it is the cheapest
  # signal a reviewer gets about where a change came from.
  - claude
  - codex

comment_labels:
  - praise
  - nitpick
  - suggestion
  - issue
  - question
  - todo
  - thought
  - chore
  - note

# Optional. A scope names the part of the repo a change touches, and it is
# what turns `type` alone into a coordinate: `feat` says what happened,
# `feat(hooks)` says where. Leave the block out entirely and any scope is
# accepted, which is how every repo starts.
#
# Only add a name once it is a real seam someone would want to read the
# history of. A list that does not cover a change you legitimately need to
# make is a list that sends you looking for --no-verify — add the scope here
# instead.
scopes:
  - hooks         # .githooks/
  - commitlint    # commitlint.config.js
  - skill         # .claude/skills/git-conventions/
  - agents        # AGENTS.md
  - install       # install.sh
  - tests         # tests/
  - docs          # README.md, docs/, CONTRIBUTING.md, SECURITY.md
  - ci            # .github/workflows/
  - deps          # dependencies (Dependabot writes this one)
  - deps-dev      # devDependencies (Dependabot writes this one)
