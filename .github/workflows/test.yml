# This workflow tests the kit itself and is deliberately NOT mirrored under
# templates/ — adopting repos receive conventions.yml only.
# tests/drift_test.js knows about that asymmetry.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Warnings, not just errors. --severity=error catches little more than
      # parse failures, and the class that actually matters here is the one
      # below it: an unquoted variable in a script that runs rm -rf against a
      # path the caller supplied. install.sh writes into other people's
      # repositories, so it is held to that.
      - name: shellcheck
        run: shellcheck --severity=warning install.sh tests/install_test.sh templates/githooks/*
      - name: tests
        run: npm test
