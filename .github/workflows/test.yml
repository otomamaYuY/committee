# This workflow tests the kit itself and is deliberately NOT mirrored under
# templates/ — adopting repos receive conventions.yml only.
# tests/drift_test.js knows about that asymmetry.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Down to info, which is where the check that matters here lives:
      # SC2086, an unquoted variable expansion, is info — not warning — and
      # install.sh runs rm -rf against a path its caller supplied and writes
      # into other people's repositories. Style is excluded deliberately;
      # everything at info and above is a correctness signal.
      - name: shellcheck
        run: shellcheck --severity=info install.sh tests/install_test.sh templates/githooks/*
      - name: tests
        run: npm test
