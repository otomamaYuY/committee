name: conventions
# `edited` is not in the default set (opened, synchronize, reopened), and
# without it the pull request title is checked once at open and never again
# — so retitling after a green run puts an unchecked subject on the default
# branch, which is precisely the gap the title check exists to close.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
# Both checks only read the history they validate.
permissions:
  contents: read
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm install` rather than `npm ci`: it uses the lockfile when there is
      # one and still works in a repo that has not committed one yet.
      # --ignore-scripts because this job only needs commitlint to run, and a
      # pull_request build installs dependencies a pull request can change.
      - run: npm install --no-audit --no-fund --ignore-scripts

      # Without this, a repo that never added the dev dependencies fails the
      # next step with a module-resolution error naming neither the packages
      # nor this kit — the most likely way for an adopter to land here, since
      # install.sh cannot add dependencies to an existing package.json.
      # `require.resolve` rather than `npx --version`: same answer, ~40ms
      # instead of ~320ms.
      - name: preflight
        run: |
          if ! node -e 'require.resolve("@commitlint/cli")' >/dev/null 2>&1; then
            echo "::error::commitlint is not installed. Add @commitlint/cli, @commitlint/config-conventional and js-yaml to devDependencies (see package.json.example in the committee kit)."
            exit 1
          fi

      # Values from the event go through the environment, never string
      # interpolation into the shell — the habit that keeps a workflow from
      # becoming a script-injection sink when a field is attacker-controlled.
      - name: commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A squash merge puts the PULL REQUEST's title on the default branch
      # and throws away every commit checked above. So on a squash workflow
      # this is the only subject that actually survives — and it is the one
      # nothing else looks at. commitlint reads it from stdin; no extra tool.
      - name: pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx --no -- commitlint --verbose

      # The same hook developers run locally, driven through git's own
      # pre-push protocol: one "<local ref> <local sha> <remote ref>
      # <remote sha>" line per ref. A pull_request build checks out a
      # detached merge ref, so the branch under test is fed in rather than
      # read from HEAD — through the hook's real input, not a side channel.
      #
      # This deliberately runs the hook from the PR's own checkout: a PR that
      # fixes the hook has to be testable. The job holds only contents: read
      # and no secrets, so what a PR can reach here it could reach anyway.
      - name: branch name
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'refs/heads/%s %s refs/heads/%s %s\n' \
            "$BRANCH" "$HEAD_SHA" "$BRANCH" "$HEAD_SHA" | ./.githooks/pre-push
