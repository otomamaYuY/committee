name: conventions
on: pull_request
# Both checks only read the history they validate.
permissions:
  contents: read
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # `npm install` rather than `npm ci`: it uses the lockfile when there is
      # one and still works in a repo that has not committed one yet.
      - run: npm install --no-audit --no-fund

      # Values from the event go through the environment, never string
      # interpolation into the shell — the habit that keeps a workflow from
      # becoming a script-injection sink when a field is attacker-controlled.
      - name: commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # The same hook developers run locally, so CI cannot disagree with it.
      - name: branch name
        env:
          COMMITTEE_BRANCH: ${{ github.head_ref }}
        run: ./.githooks/pre-push
