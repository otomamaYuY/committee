name: commit-check
on: [pull_request]
# This job only reads the history it checks. Without an explicit block it
# inherits the repository default, which is read-write in any repo that has
# not opted into the read-only default — a write-scoped token handed to a
# third-party action on every pull request.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Pinned to the commit v1 pointed at, not to the tag: a tag is mutable,
      # so `@v1` means "whatever that repo's maintainer — or anyone who
      # compromises it — makes v1 point to at the moment this job runs".
      # Upgrading to v2 is deliberately NOT bundled with this pin: v2 replaced
      # .commit-check.yml with cchk.toml, so moving without rewriting the
      # config would leave the config silently ignored and the checks running
      # on upstream defaults.
      - uses: commit-check/commit-check-action@04667fa89b3d3feb0f28facf9c5ff944a5500e85 # v1
