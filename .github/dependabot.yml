version: 2
updates:
  # The kit ships these versions to every adopting repo through
  # templates/package.json.example, so an update here is an update there.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      # Conventional Commits, because this repo enforces them on itself and
      # Dependabot's commits are preserved on the default branch like any
      # other PR's.
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
